<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — EduBot AI</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--p:#6C63FF;--a:#43E8D8;--bg:#0D0E1A;--card:#1E2035;--border:#2E3050;--text:#E8EAFF;--text2:#9FA3CC}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 30%,rgba(108,99,255,0.12),transparent 50%),radial-gradient(ellipse at 80% 70%,rgba(67,232,216,0.07),transparent 50%);pointer-events:none}
.auth-wrap{width:100%;max-width:440px;padding:24px;position:relative;z-index:1}
.auth-brand{text-align:center;margin-bottom:36px}
.brand-icon{width:56px;height:56px;background:linear-gradient(135deg,var(--p),var(--a));border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;margin:0 auto 14px;box-shadow:0 8px 30px rgba(108,99,255,0.4)}
.auth-brand h1{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;background:linear-gradient(135deg,var(--p),var(--a));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.auth-brand p{color:var(--text2);font-size:14px;margin-top:4px}
.auth-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:36px}
.form-group{margin-bottom:18px}
.form-label{display:block;font-size:13px;font-weight:600;color:var(--text2);margin-bottom:8px}
.input-wrap{position:relative}
.input-wrap i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text2);font-size:15px}
.form-control{width:100%;background:#12141F;border:1.5px solid var(--border);border-radius:11px;padding:12px 14px 12px 42px;color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:.2s}
.form-control:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(108,99,255,0.12)}
.form-control::placeholder{color:#4B4F6E}
.btn-submit{width:100%;background:linear-gradient(135deg,var(--p),#5A52E0);color:#fff;border:none;padding:13px;border-radius:11px;font-size:15px;font-weight:700;cursor:pointer;transition:.2s;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 4px 20px rgba(108,99,255,0.35)}
.btn-submit:hover{transform:translateY(-1px);box-shadow:0 8px 28px rgba(108,99,255,0.45)}
.auth-footer{text-align:center;margin-top:20px;font-size:14px;color:var(--text2)}
.auth-footer a{color:var(--p);text-decoration:none;font-weight:600}
.alert{padding:12px 16px;border-radius:10px;margin-bottom:16px;font-size:13px;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:#EF4444;display:flex;align-items:center;gap:10px}
.divider{display:flex;align-items:center;gap:12px;margin:18px 0;color:var(--text2);font-size:12px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-brand">
    <div class="brand-icon"><i class="fas fa-graduation-cap"></i></div>
    <h1>EduBot AI</h1>
    <p>Welcome back! Sign in to continue learning</p>
  </div>
  <div class="auth-card">
    {% if messages %}
    {% for msg in messages %}<div class="alert"><i class="fas fa-exclamation-circle"></i> {{ msg }}</div>{% endfor %}
    {% endif %}
    <form method="POST">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">Username</label>
        <div class="input-wrap"><i class="fas fa-user"></i><input name="username" class="form-control" placeholder="Enter your username" required></div>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="input-wrap"><i class="fas fa-lock"></i><input name="password" type="password" class="form-control" placeholder="Enter your password" required></div>
      </div>
      <button type="submit" class="btn-submit"><i class="fas fa-sign-in-alt"></i> Sign In</button>
    </form>
    <div class="auth-footer">
      Don't have an account? <a href="{% url 'register' %}">Create Account</a>
    </div>
  </div>
</div>
</body>
</html>
