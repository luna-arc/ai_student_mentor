<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — EduBot AI</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--p:#6C63FF;--a:#43E8D8;--bg:#0D0E1A;--card:#1E2035;--border:#2E3050;--text:#E8EAFF;--text2:#9FA3CC}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 30%,rgba(108,99,255,0.12),transparent 50%);pointer-events:none}
.auth-wrap{width:100%;max-width:500px;position:relative;z-index:1}
.auth-brand{text-align:center;margin-bottom:28px}
.brand-icon{width:52px;height:52px;background:linear-gradient(135deg,var(--p),var(--a));border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;margin:0 auto 12px}
.auth-brand h1{font-family:'Syne',sans-serif;font-size:24px;font-weight:800;background:linear-gradient(135deg,var(--p),var(--a));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.auth-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:32px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:13px;font-weight:600;color:var(--text2);margin-bottom:7px}
.input-wrap{position:relative}
.input-wrap i{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--text2);font-size:14px}
.form-control{width:100%;background:#12141F;border:1.5px solid var(--border);border-radius:10px;padding:11px 13px 11px 40px;color:var(--text);font-size:13px;font-family:inherit;outline:none;transition:.2s}
.form-control:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(108,99,255,0.1)}
.form-control::placeholder{color:#4B4F6E}
select.form-control{cursor:pointer}
select.form-control option{background:#1A1C2E}
.btn-submit{width:100%;background:linear-gradient(135deg,var(--p),#5A52E0);color:#fff;border:none;padding:13px;border-radius:11px;font-size:15px;font-weight:700;cursor:pointer;transition:.2s;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:10px}
.btn-submit:hover{transform:translateY(-1px);box-shadow:0 8px 28px rgba(108,99,255,0.4)}
.auth-footer{text-align:center;margin-top:18px;font-size:14px;color:var(--text2)}
.auth-footer a{color:var(--p);text-decoration:none;font-weight:600}
.alert{padding:12px 16px;border-radius:10px;margin-bottom:14px;font-size:13px;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:#EF4444;display:flex;align-items:center;gap:10px}
.section-divider{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;color:var(--text2);margin:20px 0 14px;padding-bottom:8px;border-bottom:1px solid var(--border)}
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-brand">
    <div class="brand-icon"><i class="fas fa-graduation-cap"></i></div>
    <h1>Create Your Account</h1>
  </div>
  <div class="auth-card">
    {% if messages %}{% for msg in messages %}<div class="alert"><i class="fas fa-exclamation-circle"></i> {{ msg }}</div>{% endfor %}{% endif %}
    <form method="POST">
      {% csrf_token %}
      <div class="section-divider">Personal Info</div>
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">First Name</label>
          <div class="input-wrap"><i class="fas fa-user"></i><input name="first_name" class="form-control" placeholder="John" required></div>
        </div>
        <div class="form-group">
          <label class="form-label">Last Name</label>
          <div class="input-wrap"><i class="fas fa-user"></i><input name="last_name" class="form-control" placeholder="Doe" required></div>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Username</label>
        <div class="input-wrap"><i class="fas fa-at"></i><input name="username" class="form-control" placeholder="johndoe" required></div>
      </div>
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <div class="input-wrap"><i class="fas fa-envelope"></i><input name="email" type="email" class="form-control" placeholder="john@example.com" required></div>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="input-wrap"><i class="fas fa-lock"></i><input name="password" type="password" class="form-control" placeholder="Create a strong password" required></div>
      </div>
      <div class="section-divider">Academic Profile</div>
      <div class="form-group">
        <label class="form-label">Target Role / Career Goal</label>
        <div class="input-wrap"><i class="fas fa-briefcase"></i><input name="target_role" class="form-control" placeholder="e.g. Software Engineer, Data Scientist"></div>
      </div>
      <div class="form-group">
        <label class="form-label">Current Skill Level</label>
        <select name="skill_level" class="form-control" style="padding-left:13px">
          <option value="beginner">🌱 Beginner</option>
          <option value="intermediate">📚 Intermediate</option>
          <option value="advanced">🚀 Advanced</option>
        </select>
      </div>
      <button type="submit" class="btn-submit"><i class="fas fa-rocket"></i> Create My Account</button>
    </form>
    <div class="auth-footer">Already have an account? <a href="{% url 'login' %}">Sign In</a></div>
  </div>
</div>
</body>
</html>
